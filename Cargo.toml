[workspace]
resolver = "3"
members = ["xtask"]

[workspace.package]
version = "0.0.1"
edition = "2024"
readme = "README.md"
license = "ISC"
publish = false

[profile.dev]
opt-level = 1
debug = "full"
debug-assertions = true
overflow-checks = true
lto = "off"
panic = "abort"
incremental = true
codegen-units = 256

[profile.release]
opt-level = 3
debug = "none"
debug-assertions = false
overflow-checks = false
lto = "fat"
panic = "abort"
incremental = false
codegen-units = 1
